[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-feishu-notifier"
version = "0.1.0"
description = "Send Codex turn completion notifications to Feishu."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xyli" }]
dependencies = ["requests>=2.31"]

[project.scripts]
codex-feishu-notifier = "codex_feishu_notifier.cli:main"
codex-feishu-notify = "codex_feishu_notifier.codex_notify:main"
codex-feishu-stop-hook = "codex_feishu_notifier.codex_stop_hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
